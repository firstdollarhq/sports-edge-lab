[project]
name = "sportsedge"
version = "0.1.0"
description = "Predictive sports models backtested against real market odds (paper trading research project)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "nfl_data_py>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
